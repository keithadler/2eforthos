# ld65 config: one flat binary, no headers, no padding.
#
# The load address comes from ld65's -S flag (%S below), so the same sources
# can be built for $0300 (poked in through the monitor) or $0800 (BRUN from a
# DOS 3.3 disk) without editing anything.
#
# With DOS 3.3 resident, usable RAM runs $0800-$95FF -- about 35K -- since DOS
# itself occupies $9600-$BFFF.

MEMORY {
    ZP:  start = $0080, size = $0010, type = rw, define = yes;
    RAM: start = %S,    size = $8D00, file = %O;
}

SEGMENTS {
    # STARTUP is linked first, so whatever lives here sits exactly at the load
    # address.  Put the entry point in .segment "STARTUP"; everything else can
    # use plain CODE and land wherever the linker likes.
    STARTUP: load = RAM, type = ro;
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro;
    DATA: load = RAM, type = rw;
    BSS:  load = RAM, type = bss, optional = yes;
    ZEROPAGE: load = ZP, type = zp, optional = yes;
}
